services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: missionpulse
      POSTGRES_USER: missionpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - missionpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U missionpulse -d missionpulse"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  missionpulse_pgdata:
